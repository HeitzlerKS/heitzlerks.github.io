    <small class="text-sm text-gray-400 dark:text-gray-500">&copy; 2025 Keanu Sky Heitzler</small>
</footer>

<script>
    const form = document.querySelector("#kontakt form"); // Sicherstellen, dass das Formular im Kontaktbereich ausgewählt wird
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const messageInput = document.getElementById("message");

    const errorName = document.getElementById("error-name");
    const errorEmail = document.getElementById("error-email");
    const errorMessage = document.getElementById("error-message");

    const successMessage = document.getElementById("success-message");

    form.addEventListener("submit", (e) => {
        // e.preventDefault();

        let isValid = true;

        // Name-Validierung
        if (nameInput.value.trim() === "") {
            nameInput.classList.add("border-red-500", "dark:border-red-300");
            errorName.classList.remove("hidden");
            isValid = false;
        } else {
            nameInput.classList.remove("border-red-500", "dark:border-red-300");
            errorName.classList.add("hidden");
        }

        // Email-Validierung
        if (!emailInput.value.includes("@") || !emailInput.value.includes(".")) {
            emailInput.classList.add("border-red-500", "dark:border-red-300");
            errorEmail.classList.remove("hidden");
            isValid = false;
        } else {
            emailInput.classList.remove("border-red-500", "dark:border-red-300");
            errorEmail.classList.add("hidden");
        }

        // Nachrichten-Validierung
        if (messageInput.value.trim() === "") {
            messageInput.classList.add("border-red-500", "dark:border-red-300");
            errorMessage.classList.remove("hidden");
            isValid = false;
        } else {
            messageInput.classList.remove("border-red-500", "dark:border-red-300");
            errorMessage.classList.add("hidden");
        }

        if (isValid) {
            // Fehler-Border entfernen, falls zuvor gesetzt
            nameInput.classList.remove("border-red-500", "dark:border-red-300");
            emailInput.classList.remove("border-red-500", "dark:border-red-300");
            messageInput.classList.remove("border-red-500", "dark:border-red-300");

            // Erfolgsmeldung anzeigen mit Animation
            successMessage.classList.remove("hidden");
            setTimeout(() => {
                successMessage.classList.add("opacity-100", "scale-100");
            }, 10); // Kurze Verzögerung, damit Transition wirkt

            setTimeout(() => {
                successMessage.classList.remove("opacity-100", "scale-100");
            }, 4000); // Bleibt 4 Sekunden sichtbar

            setTimeout(() => {
                successMessage.classList.add("hidden"); // Dann wieder verstecken
                form.reset(); // Formular zurücksetzen, nachdem Meldung ausgeblendet ist
            }, 4500); // Gesamte Dauer der Animation + Wartezeit
        }
    });
</script>
